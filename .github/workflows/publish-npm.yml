name: Publish to npm

on:
  workflow_dispatch:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Verify version format
        uses: nowsprinting/check-version-format-action@v5.0.7
        id: "version"

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org"

      - name: Install npm 12
        run: npm install -g npm@12

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run dist

      - name: Stage release on npm
        if: "${{ startsWith(github.ref, 'refs/tags/') && steps.version.outputs.is_valid == 'true' }}"
        run: npm stage publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_STAGE_TOKEN }}

      - name: Create GitHub Release
        if: "${{ startsWith(github.ref, 'refs/tags/') && steps.version.outputs.is_valid == 'true' }}"
        uses: softprops/action-gh-release@v3
        with:
          files: publish/*.jpl
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
